services:
  - type: web
    name: royal-shopping-api
    env: node
    plan: free
    buildCommand: cd server && npm install && npx prisma migrate deploy
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        value: RoyalShopping2024SecureKey123456789ForProduction
      - key: ACCESS_EXPIRES
        value: 15m
      - key: REFRESH_EXPIRES_DAYS
        value: "30"
      - key: CLIENT_URL
        value: https://royal-shopping.vercel.app

databases:
  - name: royal-shopping-db
    plan: free
